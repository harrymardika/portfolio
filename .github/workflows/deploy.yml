# Build and publish the production images to GHCR (ADR 0005/0010, docs/07-deployment.md).
# The home server pulls them with docker/deploy/update.sh; nothing is built on the server.
#   - on push to main: deploy the change
#   - every 6 hours: refresh GitHub projects and PDFs (T3.3)
#   - manually from the Actions tab
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing image (e.g. the assistant) must not cancel the site's own images.
      fail-fast: false
      matrix:
        target: [web, stats, assistant]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/portfolio-${{ matrix.target }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The corner chat is built in once the owner sets the repository variable PUBLIC_ASSISTANT_ENABLED
          # to true (Settings → Secrets and variables → Actions → Variables), after installing the service (T11.6).
          build-args: |
            PUBLIC_ASSISTANT_ENABLED=${{ vars.PUBLIC_ASSISTANT_ENABLED == 'true' }}
          # Raises the GitHub API limit for the project sync; mounted as a build secret, never in a layer.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
