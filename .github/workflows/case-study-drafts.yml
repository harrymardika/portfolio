# Draft case studies for new repositories tagged `portfolio` with AI (T8.2, ADR 0013).
# Opens one pull request per repository with `draft: false`: merging it publishes the case study, so the
# pull request is the review step. Needs repository secrets GEMINI_API_KEY and/or GROQ_API_KEY, and
# Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
# Only scheduled and manual runs: never triggered by pull requests, so forks cannot reach the secrets.
name: Case study drafts

on:
  # GitHub runs schedules on a best-effort basis and sometimes drops one under load (the first
  # 02:41 run on 2026-10-08 never started), so a second slot catches up the same day. Repos that
  # already have a draft branch are skipped, so the extra run costs no AI quota when nothing is new.
  schedule:
    - cron: '41 2,14 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: case-study-drafts
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pinned to commits: this job can push branches. Always read main, even on a manual run elsewhere.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Draft case studies
        run: bun run drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
