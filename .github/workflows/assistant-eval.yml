# Quality and safety evaluation of the "Ask Harry" assistant with the real models (T11.5, ADR 0014).
# Manual only (Actions → Assistant eval → Run workflow): builds the site's knowledge, asks the ~30 cases in
# tests/eval/assistant-cases.yaml through the production setup, and writes the graded report to the run's
# summary and an artifact. Uses the chatbot keys when set, otherwise the AI draft keys; questions and answers
# are public test data, and nothing is stored or pushed.
name: Assistant eval

on:
  workflow_dispatch:
    inputs:
      groq:
        description: 'Groq fallback: every case (slow, ±35 min), the marked subset (±15 min), or none'
        type: choice
        options: [subset, all, none]
        default: subset

permissions:
  contents: read

concurrency:
  group: assistant-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Every action is pinned to a commit, since this job holds API keys.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for the PDFs
        run: bunx playwright install --with-deps chromium

      # The knowledge step checks every link against the finished site, PDFs included.
      - name: Build the site and its knowledge
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Ask the evaluation questions
        # The input goes through an environment variable, never straight into the shell line.
        run: bun scripts/assistant-eval.ts "--groq=$GROQ_MODE"
        env:
          GROQ_MODE: ${{ inputs.groq }}
          GEMINI_API_KEY: ${{ secrets.ASSISTANT_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.ASSISTANT_GROQ_API_KEY || secrets.GROQ_API_KEY }}

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: assistant-eval-report
          path: assistant-eval-report.md
          if-no-files-found: ignore
