# Local development with hot reload: docker compose -f docker/compose.dev.yml up
name: harry-portfolio-dev

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      # Host port is configurable when 4321 is taken: DEV_PORT=4331 docker compose -f docker/compose.dev.yml up
      - '${DEV_PORT:-4321}:4321'
    environment:
      SITE_URL: http://localhost:4321
    volumes:
      # Source code from the host, so edits trigger hot reload.
      - ..:/app
      # Linux-built dependencies stay inside the container instead of overwriting the host's node_modules.
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
