# The /homelab page: how this site is built and served from a home server.
# Schema: docs/04-content-guide.md §3.

intro:
  en: This site runs on a server in my home, not on a cloud platform. Every change goes through an automated pipeline, and visitors reach it through an encrypted tunnel without a single open port on my router.
  id: Situs ini berjalan di server di rumah saya, bukan di platform cloud. Setiap perubahan melewati pipeline otomatis, dan pengunjung mengaksesnya lewat tunnel terenkripsi tanpa satu pun port terbuka di router saya.

# Steps from a git push to a visitor's browser (docs/07-deployment.md).
pipeline:
  - title: { en: Push to GitHub, id: Push ke GitHub }
    body:
      en: Code and content live in one repository. Editing a YAML file is enough to update the website, the CV, and the portfolio PDF.
      id: Kode dan konten ada di satu repositori. Cukup mengedit satu file YAML untuk memperbarui website, CV, dan PDF portfolio.
  - title: { en: Build in GitHub Actions, id: Build di GitHub Actions }
    body:
      en: Type checks, unit tests, and browser tests run first. Then a Docker image is built, including fresh GitHub project data and the PDFs, and pushed to the GitHub Container Registry.
      id: Pemeriksaan tipe, unit test, dan tes browser dijalankan lebih dulu. Lalu image Docker dibangun, termasuk data proyek GitHub terbaru dan PDF, dan dikirim ke GitHub Container Registry.
  - title: { en: Pull on the home server, id: Ditarik oleh server rumah }
    body:
      en: Watchtower notices the new image and restarts the container. Caddy serves the static files with strict security headers. The server never builds code itself.
      id: Watchtower mendeteksi image baru dan me-restart container. Caddy menyajikan file statis dengan header keamanan yang ketat. Server tidak pernah membangun kode sendiri.
  - title: { en: Through a Cloudflare Tunnel, id: Lewat Cloudflare Tunnel }
    body:
      en: The server opens an outbound-only connection to Cloudflare, which handles HTTPS and caches pages, so the site stays up even if my home internet goes down.
      id: Server membuka koneksi keluar saja ke Cloudflare, yang menangani HTTPS dan menyimpan cache halaman, sehingga situs tetap bisa diakses walau internet rumah saya mati.

stack: [Astro, TypeScript, Three.js, Tailwind CSS, Bun, SQLite, Docker, Caddy, GitHub Actions, Cloudflare Tunnel]

