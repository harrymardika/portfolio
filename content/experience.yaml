items:
  - id: decklify
    organization: Decklify
    role: { en: Founder & CEO, id: Pendiri & CEO }
    category: founder
    location: Jakarta, Indonesia
    start: 2026-05
    end: present
    tags: [Next.js, Go, PostgreSQL, Generative AI, Product]
    highlights:
      - en: Leading development of Decklify, an AI-powered SaaS platform that automates presentation creation from text, documents, or legacy PPTX files.
        id: "Memimpin pengembangan Decklify, platform SaaS berbasis AI yang mengotomatiskan pembuatan presentasi dari teks, dokumen, atau file PPTX lama."
        focus: [ai, product, project]
      - en: Built and launched the product from scratch to **commercial launch** at decklify.id within **3 months** (Next.js, Go, PostgreSQL).
        id: "Membangun produk dari nol hingga **peluncuran komersial** di decklify.id dalam **3 bulan** (Next.js, Go, PostgreSQL)."
        focus: [product, ai, project]
      - en: "Validated product-market fit: **+45 NPS**, 8.39/10 satisfaction score, and **100+ decks** generated for 50+ users in the first 2 weeks."
        id: "Memvalidasi product-market fit: **NPS +45**, skor kepuasan 8,39/10, dan **100+ presentasi** dibuat oleh 50+ pengguna dalam 2 minggu pertama."
        focus: [product]
      - en: Designed a business model with an **83.68% contribution margin** and break-even at 11 transactions per month.
        id: "Merancang model bisnis dengan **contribution margin 83,68%** dan titik impas pada 11 transaksi per bulan."
        focus: [product]
      - en: Led a 5-person team and managed IDR 5.85M in **national grant funding** with 100% accountability.
        id: "Memimpin tim beranggotakan 5 orang dan mengelola **dana hibah nasional** sebesar Rp5,85 juta dengan akuntabilitas 100%."
        focus: [leadership, product, project]

  - id: mitra-teknologi-gemilang
    organization: PT. Mitra Teknologi Gemilang
    role: { en: AI Engineer, id: AI Engineer }
    category: work
    location: Depok, Indonesia
    start: 2026-04
    end: 2026-07
    tags: [YOLO, Temporal Shift Module, ByteTrack, RTSP, Gemini API, Qdrant, RAG]
    highlights:
      - en: Engineered a **real-time crowd violence detection engine** combining YOLO and a Temporal Shift Module (TSM) to process concurrent RTSP CCTV streams.
        id: "Merekayasa **mesin deteksi kekerasan massa real-time** yang menggabungkan YOLO dan Temporal Shift Module (TSM) untuk memproses beberapa siaran CCTV RTSP secara bersamaan."
        focus: [ai, data]
      - en: Architected an optimized video pipeline using Grid-9-Modified (5 active cells) frame decomposition, **reducing computational overhead by 45%** while keeping tracking accurate with ByteTrack.
        id: "Merancang pipeline video teroptimasi dengan dekomposisi frame Grid-9-Modified (5 sel aktif) yang **mengurangi beban komputasi sebesar 45%** dengan pelacakan tetap akurat menggunakan ByteTrack."
        focus: [ai, data]
      - en: Integrated the Google Gemini API into the surveillance architecture for automated multimodal reasoning on live camera feeds.
        id: "Mengintegrasikan Google Gemini API ke arsitektur pengawasan untuk penalaran multimodal otomatis pada siaran kamera langsung."
        focus: [ai]
      - en: Migrated the multi-agent orchestrator's RAG storage from local FAISS to a scalable Qdrant vector database, speeding up semantic search for real-time event and location queries.
        id: "Memigrasikan penyimpanan RAG pada orkestrator multi-agent dari FAISS lokal ke basis data vektor Qdrant yang skalabel, sehingga pencarian semantik untuk kueri kejadian dan lokasi real-time menjadi lebih cepat."
        focus: [ai, data]

