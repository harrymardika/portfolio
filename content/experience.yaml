  - id: gunadarma-ai-researcher
    organization: Universitas Gunadarma
    role: { en: AI Researcher (Grant Project), id: Peneliti AI (Proyek Hibah) }
    category: research
    location: Depok, Indonesia
    start: 2025-09
    end: 2025-12
    tags: [Multimodal AI, MobileNetV3, NLP, Edge AI, Hailo-8L, Quantization]
    highlights:
      - en: Built a real-time multimodal crisis-detection system fusing facial emotion, body-pose cues, and speech sentiment, achieving **92.5% accuracy (AUC 0.96)** and 0.92 F1-score in early suicide-risk detection.
        id: "Membangun sistem deteksi krisis multimodal real-time yang menggabungkan emosi wajah, isyarat pose tubuh, dan sentimen ucapan, dengan **akurasi 92,5% (AUC 0,96)** dan F1-score 0,92 untuk deteksi dini risiko bunuh diri."
        focus: [ai, data]
      - en: Designed optimized MobileNetV3 CNNs and a precision-tuned fusion mechanism, **cutting life-critical false negatives by 35%**.
        id: "Merancang CNN MobileNetV3 yang teroptimasi dan mekanisme fusi yang disetel untuk presisi, sehingga **false negative yang kritis berkurang 35%**."
        focus: [ai]
      - en: Optimized Edge AI deployment on Hailo-8L, reaching **5–8 ms latency and 30+ FPS** at about 2 W, a 300–500% improvement over CPU.
        id: "Mengoptimalkan deployment Edge AI di Hailo-8L hingga mencapai **latensi 5–8 ms dan 30+ FPS** pada daya sekitar 2 W, 300–500% lebih baik dibanding CPU."
        focus: [ai]
      - en: Led the full data and optimization pipeline (11k+ images, 1k+ transcripts) and applied 8-bit quantization, **cutting model size by 40%** with no accuracy drop.
        id: "Memimpin seluruh pipeline data dan optimasi (11 ribu+ gambar, 1 ribu+ transkrip) serta menerapkan kuantisasi 8-bit yang **memperkecil ukuran model 40%** tanpa penurunan akurasi."
        focus: [ai, data]

