# Which public GitHub repositories appear as projects (decision D5, docs/04-content-guide.md §4).
# Shown = (include ∪ repos with the topic below) − exclude. Synced on every build (bun run fetch:github).

username: harrymardika

# Add this topic to a repo on GitHub (About → ⚙️ → Topics) to show it without editing this file.
topic: portfolio

# Shown in this order. Three forms (docs/04-content-guide.md §4):
#   - repo-name                                  plain repo, GitHub description
#   - repo: repo-name                            repo with your own bilingual description
#     description: { en: ..., id: ... }
#   - title: Project name                        several repos that are one project (one card,
#     repos: [main-repo, other-repo]             linked to the first repo)
#     description: { en: ..., id: ... }
# Descriptions were written from each repo's README on 2026-10-05.
include:
  # Repos that already have a case study in content/projects (linked via links.repo, so no duplicate card).
  - tsm-grid-camera
  - suicide-crisis-detection
  - aksara-jawa
  - hoax-detection
  - xss-detection-pipeline
  - BCA-Stock-Forecasting

  # Projects split across several repos.
  - title: Chatbot RAG Universitas Gunadarma
    repos: [gunadarma-ai, chatbot-rag-gunadarma-backend, chatbot-rag-gunadarma-frontend, client-gunadarma-ai]
    description:
      en: A retrieval-augmented chatbot that answers academic questions from verified Universitas Gunadarma sources, with hybrid search, semantic caching, and Chainlit and React interfaces.
      id: Chatbot berbasis RAG yang menjawab pertanyaan akademik dari sumber resmi Universitas Gunadarma, dengan hybrid search, semantic caching, serta antarmuka Chainlit dan React.
  - title: Netflix Prize data warehouse & recommender
    repos: [netflix-big-data-analytics, netflix-data-ingestion, netflix-modelling]
    description:
      en: End-to-end data engineering and machine learning on the Netflix Prize data, from a resumable ETL pipeline into a data warehouse to collaborative-filtering recommendation models.
      id: Rekayasa data dan machine learning end-to-end pada data Netflix Prize, dari pipeline ETL yang bisa dilanjutkan ke data warehouse hingga model rekomendasi collaborative filtering.
  - title: Acute lymphoblastic leukemia detection
    repos: [leukimia-detection, dashboard-blood-cell-all]
    description:
      en: Compares three deep learning models for detecting acute lymphoblastic leukemia in blood cell images (best 98.6% test accuracy), with a Streamlit app built on MobileNetV2 + CBAM.
      id: Membandingkan tiga model deep learning untuk mendeteksi leukemia limfoblastik akut dari citra sel darah (akurasi uji terbaik 98,6%), dilengkapi aplikasi Streamlit berbasis MobileNetV2 + CBAM.

  # Single repos.
  - repo: camera-genai
    description:
      en: Real-time detection of unusual behavior and security anomalies from camera feeds using Gemini vision and 2D spatial understanding.
      id: Deteksi real-time perilaku tidak wajar dan anomali keamanan dari kamera menggunakan Gemini vision dan pemahaman spasial 2D.
  - repo: text-summarization-indobert
    description:
      en: BERT-based extractive summarization for assessing academic proposals, combining feature-based methods with cosine similarity and latent semantic analysis.
      id: Peringkasan ekstraktif berbasis BERT untuk menilai proposal akademik, menggabungkan metode berbasis fitur dengan cosine similarity dan latent semantic analysis.
  - repo: video-emotion-cls
    description:
      en: Classifies human emotions in video into eight categories, built for the Satria Data 2025 Big Data Challenge.
      id: Mengklasifikasikan emosi manusia dalam video ke delapan kategori, dibuat untuk Satria Data 2025 Big Data Challenge.
  - repo: facial-expression-recognition
    description:
      en: Compares a convolutional network trained from scratch with transfer learning for facial expression recognition on the FER dataset.
      id: Membandingkan CNN yang dilatih dari awal dengan transfer learning untuk pengenalan ekspresi wajah pada dataset FER.
  - repo: sentiment-analysis-hatred-speech
    description:
      en: Compares four deep learning architectures, including BERT and RNN, for hate-speech and sentiment classification on Twitter data.
      id: Membandingkan empat arsitektur deep learning, termasuk BERT dan RNN, untuk klasifikasi ujaran kebencian dan sentimen pada data Twitter.
  - repo: rocm-test
    description:
      en: Benchmarks PyTorch, TensorFlow, and JAX on an AMD GPU with ROCm, from low-level compute kernels to full model workloads.
      id: Benchmark PyTorch, TensorFlow, dan JAX di GPU AMD dengan ROCm, dari kernel komputasi tingkat rendah hingga beban model lengkap.
  - repo: pengolahan-citra
    description:
      en: A web-based image processing learning tool written in Go with clean architecture.
      id: Aplikasi web untuk belajar pengolahan citra digital, ditulis dengan Go dan clean architecture.

# Repo names that are never shown, even if they have the topic.
exclude: [harrymardika, portfolio]

# Forks and archived repos are skipped unless listed in `include`.
include_forks: false
include_archived: false
