    start: 2025-02
    end: 2025-06
    tags: [FastAPI, TensorFlow, React.js, Hapi.js, Supabase, PWA]
    highlights:
      - en: Selected as 1 of 2,500 students from 63,000 applicants nationwide.
        id: "Terpilih sebagai 1 dari 2.500 peserta dari 63.000 pendaftar di seluruh Indonesia."
      - en: Graduated with Distinction (average score 94.5/100).
        id: "Lulus dengan predikat Distinction (rata-rata nilai 94,5/100)."
      - en: Built Dompet Juara, a personal finance web app that uses ML to analyze spending behavior and personalize financial advice.
        id: "Membangun Dompet Juara, aplikasi web keuangan pribadi yang memakai ML untuk menganalisis pola pengeluaran dan memberi saran keuangan yang personal."
      - en: Led the ML team through an end-to-end pipeline (preparation, modeling, evaluation, deployment) with 90% model accuracy.
        id: "Memimpin tim ML melalui pipeline end-to-end (persiapan data, pemodelan, evaluasi, deployment) dengan akurasi model 90%."
      - en: Deployed inference services with FastAPI and TensorFlow, integrated with React.js, Hapi.js, and Supabase, delivered as a PWA.
        id: "Men-deploy layanan inferensi dengan FastAPI dan TensorFlow yang terintegrasi dengan React.js, Hapi.js, dan Supabase, disajikan sebagai PWA."

