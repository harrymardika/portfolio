        end-to-end operations of a hackathon for **100+ participants and 30 teams**; and managed cross-functional
        teams organizing workshops, technical events, and competition preparation programs. A background in AI
        engineering helps scope technical work realistically. Informatics graduate (**GPA 3.99/4.00**).
      id: >-
        Pemimpin proyek yang bekerja dengan rencana dan pembagian tanggung jawab yang jelas. Memimpin tim 5 orang
        hingga **peluncuran komersial dalam 3 bulan** dan mengelola dana hibah nasional Rp5,85 juta dengan
        **akuntabilitas 100%**; menjalankan operasional hackathon dari awal hingga akhir untuk **100+ peserta dan
        30 tim**; serta mengelola tim lintas fungsi yang menyelenggarakan workshop, acara teknis, dan program
        persiapan kompetisi. Latar belakang AI engineering membantu menakar pekerjaan teknis secara realistis.
        Lulusan Informatika (**IPK 3,99/4,00**).
    focus: [project, leadership]
    sections: [experience, leadership, skills, education, awards, training, certifications]
    skills: [leadership, product-web, ml-cv, languages]

