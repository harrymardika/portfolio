# CV variants (Phase 10, decision D10): one CV per kind of position, built from the same content.
# Each variant only selects and orders existing text; the summary repeats facts already in content/.
# PDFs: /downloads/cv/, listed on /cv/ (linked from the footer). See docs/04-content-guide.md.
variants:
  - id: ai-ml-engineer
    name: { en: AI/ML Engineer, id: AI/ML Engineer }
    role: { en: AI/ML Engineer, id: AI/ML Engineer }
    summary:
      en: >-
        AI/ML engineer who builds and ships computer vision, NLP, and edge AI systems with Python,
        PyTorch, and TensorFlow. Built a multimodal crisis-detection model with **92.5% accuracy (AUC
        0.96)** and deployed it on Hailo-8L at **5–8 ms latency**; engineered a real-time crowd violence
        detection engine that **cut computational overhead by 45%**. Founder of Decklify, an AI SaaS
        launched in 3 months. Informatics graduate (**GPA 3.99/4.00**) and GEMASTIK XVIII Data Mining
        finalist.
      id: >-
        AI/ML engineer yang membangun dan meluncurkan sistem computer vision, NLP, dan edge AI dengan
        Python, PyTorch, dan TensorFlow. Membangun model deteksi krisis multimodal dengan **akurasi
        92,5% (AUC 0,96)** dan men-deploy-nya di Hailo-8L dengan **latensi 5–8 ms**; merekayasa mesin
        deteksi kekerasan massa real-time yang **memangkas beban komputasi 45%**. Pendiri Decklify, SaaS
        AI yang daring dalam 3 bulan. Lulusan Informatika (**IPK 3,99/4,00**) dan finalis Data Mining
        GEMASTIK XVIII.
    focus: [ai]
    sections: [skills, experience, projects, education, training, awards, leadership, certifications]
    skills: [ai-ml, llm-genai, cloud-mlops, data, languages]
    projects: [aksara-jawa-yolo, hoax-detection, reclaimyt]

  - id: data-scientist
    name: { en: Data Scientist, id: Data Scientist }
    role: { en: Data Scientist, id: Data Scientist }
    summary:
      en: >-
        Data scientist who turns raw data into models with measurable results, using Python,
        scikit-learn, TensorFlow, and PyTorch. Built a multimodal crisis-detection model from **11k+
        images and 1k+ transcripts** reaching **92.5% accuracy (AUC 0.96)**, a BERT summarization system
        scoring **ROUGE-1 56.63%**, and forecasting models for stock and gold prices. Informatics
        graduate (**GPA 3.99/4.00**), GEMASTIK XVIII Data Mining finalist, and Top 5 of 40 teams in
        Regression Rumble (Neurontara Data Clash).
      id: >-
        Data scientist yang mengubah data mentah menjadi model dengan hasil terukur, memakai Python,
        scikit-learn, TensorFlow, dan PyTorch. Membangun model deteksi krisis multimodal dari **11 ribu+
        citra dan 1 ribu+ transkrip** dengan **akurasi 92,5% (AUC 0,96)**, sistem peringkasan berbasis
        BERT dengan **ROUGE-1 56,63%**, serta model peramalan harga saham dan emas. Lulusan Informatika
        (**IPK 3,99/4,00**), finalis Data Mining GEMASTIK XVIII, dan 5 besar dari 40 tim di Regression
        Rumble (Neurontara Data Clash).
    focus: [ai, data]
    sections: [skills, experience, projects, training, education, awards, certifications, leadership]
    skills: [ai-ml, data, llm-genai, cloud-mlops, languages]
    projects: [gold-price-prediction, prediction-world-cup, bca-stock-lstm]

  - id: data-engineer
    name: { en: Data Engineer, id: Data Engineer }
    role: { en: Data Engineer, id: Data Engineer }
    summary:
      en: >-
        Data engineer with hands-on experience building data and ML pipelines in Python, SQL, Spark, and
        Airflow. Led the data and optimization pipeline for **11k+ images and 1k+ transcripts**, built
        end-to-end ML pipelines with TensorFlow Extended (TFX) monitored in Prometheus and Grafana, and
        migrated RAG storage from FAISS to a Qdrant vector database for faster semantic search.
        Informatics graduate (**GPA 3.99/4.00**) and GEMASTIK XVIII Data Mining finalist.
      id: >-
        Data engineer dengan pengalaman langsung membangun pipeline data dan ML dengan Python, SQL,
        Spark, dan Airflow. Memimpin pipeline data dan optimasi untuk **11 ribu+ citra dan 1 ribu+
        transkrip**, membangun pipeline ML end-to-end dengan TensorFlow Extended (TFX) yang dipantau di
        Prometheus dan Grafana, serta memindahkan penyimpanan RAG dari FAISS ke vector database Qdrant
        agar pencarian semantik lebih cepat. Lulusan Informatika (**IPK 3,99/4,00**) dan finalis Data
        Mining GEMASTIK XVIII.
    focus: [data]
    sections: [skills, experience, projects, training, education, awards, certifications, leadership]
    skills: [data, cloud-mlops, ai-ml, languages]
    projects: [hoax-detection, humadity-iot-main, portfolio-site]

  - id: data-analyst
    name: { en: Data Analyst, id: Data Analyst }
    role: { en: Data Analyst, id: Data Analyst }
    summary:
      en: >-
        Data analyst who turns data into decisions with Python, SQL, and BI tools (Power BI, Tableau,
        Looker Studio). Evaluated Decklify through user testing (**+45 NPS**, ease of use 8.39/10) and
        built its cost model (**83.68% contribution margin**, break-even at 11 packages a month). Built
        forecasting and classification models, including a spending-behavior model with **90%
        accuracy**. Informatics graduate (**GPA 3.99/4.00**) and GEMASTIK XVIII Data Mining finalist.
      id: >-
        Data analyst yang mengubah data menjadi keputusan dengan Python, SQL, dan alat BI (Power BI,
        Tableau, Looker Studio). Mengevaluasi Decklify lewat uji pengguna (**NPS +45**, kemudahan
        8,39/10) dan menyusun model biayanya (**margin kontribusi 83,68%**, titik impas 11 paket per
        bulan). Membangun model peramalan dan klasifikasi, termasuk model perilaku belanja dengan
        **akurasi 90%**. Lulusan Informatika (**IPK 3,99/4,00**) dan finalis Data Mining GEMASTIK XVIII.
    focus: [data, product]
    sections: [skills, experience, projects, training, education, awards, certifications, leadership]
    skills: [data, ai-ml, product-management, languages]
    projects: [prediction-world-cup, gold-price-prediction, coinbase-sentiment-analysis]

  - id: product-manager
    name: { en: Product Manager, id: Product Manager }
    role: { en: Product Manager, id: Product Manager }
    summary:
      en: >-
        Product manager who takes ideas from user problem to launched product. As founder of Decklify,
        took an AI SaaS from idea to **launch in 3 months**: planned the product, ran user research and
        evaluation (user testing with **+45 NPS**, expert focus groups, a load test of 200 concurrent
        generations), and designed a business model with an **83.68% contribution margin**, reaching
        **45 paid transactions** in the first month of sales. Informatics graduate (**GPA 3.99/4.00**)
        with hands-on AI engineering.
      id: >-
        Product manager yang membawa ide dari masalah pengguna hingga produk diluncurkan. Sebagai
        pendiri Decklify, membawa SaaS AI dari ide hingga **daring dalam 3 bulan**: merencanakan produk,
        menjalankan riset pengguna dan evaluasi (uji pengguna dengan **NPS +45**, FGD bersama pakar, uji
        beban 200 generasi serentak), serta merancang model bisnis dengan **margin kontribusi 83,68%**
        hingga mencapai **45 transaksi berbayar** di bulan pertama penjualan. Lulusan Informatika (**IPK
        3,99/4,00**) dengan pengalaman langsung di AI engineering.
